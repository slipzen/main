<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slipzen/main</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

    :root {
      --bg: #1a0a2e;
      --bg2: #0d0520;
      --blue: #4040c0;
      --light-blue: #7070ff;
      --cyan: #40c0ff;
      --white: #d0d0ff;
      --dim: #6060a0;
      --border: #3030a0;
      --gold: #c0a040;
      --green: #40c080;
      --red: #ff4060;
      --blink: #a0a0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg2);
      color: var(--white);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      padding: 2rem 1rem;
      /* Scanline overlay */
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.12) 2px,
        rgba(0,0,0,0.12) 4px
      );
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .ascii-logo {
      font-family: 'VT323', monospace;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--light-blue);
      line-height: 1.15;
      white-space: pre;
      text-shadow: 0 0 8px var(--blue), 0 0 20px var(--blue);
      margin-bottom: 0.5rem;
    }

    .title-bar {
      background: var(--blue);
      color: var(--white);
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      padding: 0.25rem 1.5rem;
      display: inline-block;
      border: 2px solid var(--light-blue);
      box-shadow: 4px 4px 0 var(--bg), inset 0 0 20px rgba(64,64,192,0.5);
      margin-bottom: 0.75rem;
      text-shadow: 1px 1px 0 #000;
    }

    .subtitle {
      color: var(--dim);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      background: var(--blink);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── SECTIONS ───────────────────────────────── */
    .section {
      border: 2px solid var(--border);
      margin-bottom: 2rem;
      background: rgba(20, 10, 50, 0.8);
    }

    .section-header {
      background: var(--border);
      color: var(--cyan);
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      letter-spacing: 0.2em;
      padding: 0.2rem 0.75rem;
      text-shadow: 0 0 8px var(--cyan);
    }

    .section-header::before { content: "▶ "; }

    .section-body {
      padding: 1.25rem 1rem;
    }

    /* ── FILE LIST ──────────────────────────────── */
    .file-row {
      border-bottom: 1px dashed var(--border);
      padding: 1rem 0;
    }

    .file-row:last-child { border-bottom: none; }

    .file-name {
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      color: var(--gold);
      text-shadow: 0 0 6px var(--gold);
      margin-bottom: 0.2rem;
    }

    .file-desc {
      color: var(--dim);
      font-size: 0.78rem;
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .file-meta {
      color: var(--green);
      font-size: 0.72rem;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .file-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.8rem;
      border: 2px solid;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, box-shadow 0.1s;
      display: inline-block;
    }

    .btn-demo {
      border-color: var(--cyan);
      color: var(--cyan);
      background: transparent;
    }

    .btn-demo:hover {
      background: var(--cyan);
      color: var(--bg2);
      box-shadow: 0 0 12px var(--cyan);
    }

    .btn-dl {
      border-color: var(--gold);
      color: var(--gold);
      background: transparent;
    }

    .btn-dl:hover {
      background: var(--gold);
      color: var(--bg2);
      box-shadow: 0 0 12px var(--gold);
    }

    /* ── CONTACT FORM ───────────────────────────── */
    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      color: var(--cyan);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.3rem;
    }

    label::before { content: "> "; color: var(--dim); }

    input, textarea {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--white);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: var(--light-blue);
      box-shadow: 0 0 8px var(--blue);
    }

    textarea { min-height: 100px; }

    .form-status {
      font-size: 0.78rem;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }

    .form-status.ok  { color: var(--green); }
    .form-status.err { color: var(--red); }

    .btn-send {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      padding: 0.45rem 1.5rem;
      border: 2px solid var(--light-blue);
      color: var(--light-blue);
      background: transparent;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, box-shadow 0.1s;
      margin-top: 0.25rem;
    }

    .btn-send:hover {
      background: var(--light-blue);
      color: var(--bg2);
      box-shadow: 0 0 14px var(--light-blue);
    }

    /* ── FOOTER ─────────────────────────────────── */
    .footer {
      text-align: center;
      color: var(--dim);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border);
    }

    /* ── RESPONSIVE ─────────────────────────────── */
    @media (max-width: 480px) {
      .ascii-logo { font-size: 0.75rem; }
      .title-bar  { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="title-bar">slipzen/main<span class="cursor"></span></div>
    <div class="subtitle">// FILE REPOSITORY // READY.</div>
  </header>

  <!-- FILES -->
  <section class="section">
    <div class="section-header">AVAILABLE FILES</div>
    <div class="section-body">

      <div class="file-row">
        <div class="file-name">AdMisera</div>
        <div class="file-desc">Supernischat vårdadminverktyg.</div>
        <div class="file-meta">
          VER 1.0 &nbsp;|&nbsp; UPDATED: 2026-04-10
        </div>
        <div class="file-actions">
          <a class="btn btn-demo"
             href="https://slipzen.github.io/main/admisera_demo.html"
             target="_blank"
             rel="noopener noreferrer">[ DEMO ]</a>
          <a class="btn btn-dl"
             href="https://slipzen.github.io/main/admisera.html"
             download="admisera.html">[ LADDA NED ]</a>
        </div>
      </div>

    </div>
  </section>

  <!-- CONTACT -->
  <section class="section">
    <div class="section-header">KONTAKT / FEEDBACK</div>
    <div class="section-body">

      <form id="contactForm">
        <div class="form-group">
          <label for="f-name">NAMN</label>
          <input type="text" id="f-name" name="name" autocomplete="name" placeholder="Ditt namn">
        </div>
        <div class="form-group">
          <label for="f-email">E-POST</label>
          <input type="email" id="f-email" name="email" autocomplete="email" placeholder="din@mejl.se">
        </div>
        <div class="form-group">
          <label for="f-msg">MEDDELANDE</label>
          <textarea id="f-msg" name="message" placeholder="Skriv din fråga eller feedback här..."></textarea>
        </div>

        <div class="form-status" id="formStatus"></div>
        <button type="submit" class="btn-send">[ SKICKA ]</button>
      </form>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    &copy; SLIPZEN &nbsp;//&nbsp; TERMINALFROST8@HOTMAIL.COM
  </footer>

</div>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name    = document.getElementById('f-name').value.trim();
    const email   = document.getElementById('f-email').value.trim();
    const message = document.getElementById('f-msg').value.trim();
    const status  = document.getElementById('formStatus');

    if (!email || !message) {
      status.textContent = '> FEL: E-post och meddelande krävs.';
      status.className = 'form-status err';
      return;
    }

    const subject = encodeURIComponent('slipzen/main – Feedback' + (name ? ' från ' + name : ''));
    const body    = encodeURIComponent(
      (name ? 'Från: ' + name + '\n\n' : '') + message
    );

    window.location.href =
      'mailto:terminalfrost8@hotmail.com?subject=' + subject + '&body=' + body;

    status.textContent = '> ÖPPNAR E-POSTKLIENT...';
    status.className = 'form-status ok';
  });
</script>
</body>
</html>
